<!doctype html>
<!--
  ======================================================================
  COMPARE NUMBERS
  Math Explorer Club, The Break and Build Lab (BBL)

  What it teaches: to compare two numbers, look at them on the number
  line and zoom in until they PART WAYS. The place where they split is
  the first digit (from the left) that is different, and that digit
  decides which number is bigger.
    - Type two numbers, e.g. 3245 (red) and 3271 (blue).
    - The line starts one level above the longer number: 0 to 10,000.
    - While both numbers sit in the SAME step, it is still a tie at
      that place, so we zoom into that step (one orange band).
    - At the level where they land in DIFFERENT steps, the line shows
      two bands, one red and one blue. Each number can only move around
      inside its own band, whatever its later digits are. The bands
      don't overlap, so the comparison is settled. Zooming stops here.

  PREDICT, THEN REVEAL (same as Number Line Zoom):
    - Each level first shows only the ticks. Ask: "Same step, or
      different steps?" Then press Reveal.
    - Turn this off with askBeforeReveal: false in SETTINGS.

  How this file is organised (read it top to bottom):
    1. <title>, fonts and <style> : CSS, which controls how things LOOK
    2. HTML                        : WHAT is on the page
    3. <script>                    : JavaScript, how it BEHAVES

  Most of the code is the same as Number Line Zoom. New ideas here:
    - Two numbers instead of one, so the state has S.a and S.b.
    - Math.floor(n / s) works out "which step is n in" at step size s.
      Two numbers are in the same step exactly when these match.
    - A CSS grid to line up the two rows of digits by place.
  ======================================================================
-->
<html lang="en">
<head>
  <!-- Tells the browser the text uses the standard character set (so × − ✓ etc. display correctly). -->
  <meta charset="utf-8">

  <!-- Makes the page fit phone screens properly instead of showing a tiny zoomed-out desktop page. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!-- The name shown on the browser tab. -->
<title>Compare Numbers</title>

<!-- Same two fonts as the other tools, so they look like one family. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Baloo+2:wght@500;700;800&display=swap">

<style>
  /* ==================================================================
     PART 1: CSS (how things look)
     ================================================================== */

  /* ------------------------------------------------------------------
     COLOUR AND FONT SETTINGS  <- the easiest place to change the look
     The canvas drawing READS these colours too (see css() in the
     script), so changing a colour here also changes the number line.
     ------------------------------------------------------------------ */
  :root {
    --bg:        #fbf8f1;   /* page background (warm paper) */
    --card:      #ffffff;   /* background of the panels */
    --ink:       #1f2a37;   /* main text */
    --muted:     #6b7280;   /* softer text */
    --line:      #1f2a37;   /* the number line itself */
    --tick:      #374151;   /* tick marks */

    --red:       #d64545;   /* first number (A) */
    --red-soft:  rgba(214, 69, 69, 0.16);
    --blue:      #2f6fd6;   /* second number (B) */
    --blue-soft: rgba(47, 111, 214, 0.16);

    --band:      #e8a317;   /* the SHARED step, while they are tied */
    --band-soft: rgba(244, 183, 64, 0.22);
    --band-ink:  #9a6a00;   /* highlighted words in the explanation */

    --tie:       #2a9d8f;   /* digit columns that matched (a tie) */
    --unknown:   #cbd5e1;   /* digit columns not looked at yet */
    --btn:       #1f2a37;   /* main button colour */
    --btn-ink:   #ffffff;   /* text on main buttons */
  }

  /* Dark mode: the same names with darker values. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12161c; --card: #1b2129; --ink: #e8ecf1; --muted: #9aa4b2;
      --line: #e8ecf1; --tick: #c3cad4;
      --red: #ff6b6b; --red-soft: rgba(255, 107, 107, 0.18);
      --blue: #6ea8ff; --blue-soft: rgba(110, 168, 255, 0.18);
      --band: #f4b740; --band-soft: rgba(244, 183, 64, 0.18); --band-ink: #f4c76a;
      --tie: #4cc9b8; --unknown: #3b4552; --btn: #e8ecf1; --btn-ink: #12161c;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12161c; --card: #1b2129; --ink: #e8ecf1; --muted: #9aa4b2;
    --line: #e8ecf1; --tick: #c3cad4;
    --red: #ff6b6b; --red-soft: rgba(255, 107, 107, 0.18);
    --blue: #6ea8ff; --blue-soft: rgba(110, 168, 255, 0.18);
    --band: #f4b740; --band-soft: rgba(244, 183, 64, 0.18); --band-ink: #f4c76a;
    --tie: #4cc9b8; --unknown: #3b4552; --btn: #e8ecf1; --btn-ink: #12161c;
  }

  /* ------------------------------------------------------------------
     PAGE LAYOUT
     ------------------------------------------------------------------ */
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Atkinson Hyperlegible', sans-serif;
    font-size: 18px;            /* big, because it is projected */
  }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 16px; }

  h1 { font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 2rem; margin: 4px 0 0; }
  .sub { color: var(--muted); margin: 0 0 16px; }

  section { background: var(--card); border-radius: 14px; padding: 14px 16px; margin-bottom: 14px; }

  /* --- The row where you type the two numbers --- */
  .entry { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .entry input {
    font: inherit; font-size: 1.4rem; width: 8em; padding: 6px 10px;
    border: 3px solid var(--unknown); border-radius: 10px;
    background: var(--bg); color: var(--ink);
  }
  .entry input#numA { border-color: var(--red); }    /* A is red  */
  .entry input#numB { border-color: var(--blue); }   /* B is blue */
  .err { color: var(--red); font-weight: 700; }

  /* --- The digit grid: one column per place, one row per number ---
     The number of columns changes with the numbers, so the script sets
     grid-template-columns itself (see updateText). */
  .grid { display: grid; gap: 6px; justify-content: center; align-items: center; }
  .grid .head { text-align: center; font-size: 0.8rem; color: var(--muted); }
  .grid .tag  { font-weight: 700; padding-right: 6px; }
  .grid .tag.a { color: var(--red); }
  .grid .tag.b { color: var(--blue); }

  .cell {
    text-align: center; border-radius: 10px; padding: 2px 0;
    border: 3px solid var(--unknown);
    font-family: 'Baloo 2', sans-serif; font-size: 2.1rem; font-weight: 800; line-height: 1.2;
    transition: all 0.3s;                 /* smooth change of colour */
  }
  .cell.a { color: var(--red); }
  .cell.b { color: var(--blue); }
  .cell.pad    { font-style: italic; }                                 /* a 0 we added in front */
  .cell.unknown{ opacity: 0.45; }                                      /* not looked at yet */
  .cell.tie    { border-color: var(--tie); }                           /* matched */
  .cell.asking { border-color: var(--band); border-style: dashed; }    /* being asked about */
  .cell.decide { border-color: var(--band); background: var(--band-soft); transform: scale(1.1); } /* the deciding digits */
  .cell.ignore { opacity: 0.25; }                                      /* can't change the answer */

  /* --- The canvas where the number line is drawn --- */
  .stage { padding: 4px 0; }
  canvas { display: block; width: 100%; height: 240px; }

  /* --- The explanation, and the big answer line --- */
  .readout { line-height: 1.6; }
  .readout .hl { color: var(--band-ink); font-size: 1.15em; }
  .readout .ra { color: var(--red);  font-weight: 700; }
  .readout .rb { color: var(--blue); font-weight: 700; }
  .result {
    font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 2.4rem;
    text-align: center; margin-top: 6px;
  }
  .result:empty { display: none; }        /* hide the box when there is no answer yet */

  /* --- Buttons --- */
  .controls { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; background: none; padding: 0; }
  button {
    font: inherit; font-weight: 700; padding: 10px 18px; border-radius: 12px;
    border: 2px solid var(--btn); background: var(--card); color: var(--ink); cursor: pointer;
  }
  button.primary { background: var(--btn); color: var(--btn-ink); }
  button:disabled { opacity: 0.35; cursor: default; }

  /* --- The take-home rule, shown once the answer is decided --- */
  .rule {
    margin-top: 12px; padding: 12px 16px; border-radius: 12px;
    border: 3px solid var(--tie); background: var(--bg);
  }
  .rule:empty { display: none; }          /* hidden until there is an answer */
  .rule h2 { font-family: 'Baloo 2', sans-serif; font-size: 1.3rem; margin: 0 0 4px; color: var(--tie); }
  .rule .short { font-size: 1.2rem; font-weight: 700; margin: 0 0 8px; }
  .rule .why { margin: 0; line-height: 1.55; }

  @media (max-width: 600px) {
    body { font-size: 16px; }
    .cell { font-size: 1.5rem; }
  }
</style>

</head>
<body>

<!-- ====================================================================
     PART 2: HTML (what is on the page)
     ==================================================================== -->
<div class="wrap">
  <header>
    <h1>Compare Numbers</h1>
    <p class="sub">Zoom in until the two numbers part ways. That place decides which is bigger.</p>
  </header>

  <main>
    <!-- Where you type the two numbers. -->
    <section class="entry">
      <label for="numA"><b>A:</b></label>
      <input id="numA" type="text" inputmode="numeric" autocomplete="off">
      <label for="numB"><b>B:</b></label>
      <input id="numB" type="text" inputmode="numeric" autocomplete="off">
      <button id="place" class="primary">Compare</button>
      <span id="err" class="err"></span>
    </section>

    <!-- The script fills this with the two rows of digits, lined up by place. -->
    <section class="grid" id="digits"></section>

    <!-- The script draws the number line here. A's pin comes from above, B's from below. -->
    <section class="stage">
      <canvas id="line" aria-label="A number line showing where the two numbers sit"></canvas>
    </section>

    <!-- The explanation, and (once decided) the big answer like 3,245 < 3,271. -->
    <section class="readout">
      <div id="readout"></div>
      <div id="result" class="result"></div>
      <!-- The take-home rule, with why it works for THIS pair of numbers. -->
      <div id="rule" class="rule"></div>
    </section>

    <!-- Buttons. Keyboard: R or Space reveals, down arrow zooms in, up arrow zooms out. -->
    <section class="controls">
      <button id="zoomOut">− Zoom out (×10)</button>
      <button id="reveal" class="primary">Reveal</button>
      <button id="zoomIn" class="primary">Zoom in (÷10) +</button>
      <button id="reset">Back to the top</button>
    </section>
  </main>
</div>


<script>
// ======================================================================
// PART 3: JAVASCRIPT (how it behaves)
//
// Same pattern as before:
//     a click -> change the STATE -> redraw the screen from the state
//
// The state (S) holds:
//   S.a, S.b    : the two numbers (A is red, B is blue)
//   S.level     : which place we are looking at. 0 = ones, 1 = tens ...
//                 At level L the line shows 10 steps, each 10^L long.
//   S.topLevel  : the level we start at (one above the longer number)
//   S.viewLeft  : the number at the LEFT end of the line right now
//   S.viewWidth : how much of the number line is visible right now
//   S.anim      : details of a zoom in progress, or null
//   S.revealed  : has the answer at THIS level been revealed yet?
//   S.revealAlpha : how visible the answer is, 0 (hidden) to 1 (shown)
// ======================================================================


// ----------------------------------------------------------------------
// SETTINGS  <- the easiest place to change how it behaves
// ----------------------------------------------------------------------
const SETTINGS = {
  // The two numbers shown when the page first opens.
  startA: 3245,
  startB: 3271,

  // Longest number allowed. 9 digits = up to 99,99,99,999.
  maxDigits: 9,

  // Seconds one zoom takes. Bigger = slower.
  zoomTime: 1.2,

  // true : each level starts hidden, so kids can guess; press Reveal.
  // false: the answer shows straight away.
  askBeforeReveal: true,

  // Seconds the Reveal fade-in takes.
  revealTime: 0.6,
};


// ----------------------------------------------------------------------
// NAMES FOR EACH PLACE (Indian system), same as Number Line Zoom
// ----------------------------------------------------------------------
const PLACE = [
  { one: 'one',          many: 'ones',          short: 'O'   },
  { one: 'ten',          many: 'tens',          short: 'T'   },
  { one: 'hundred',      many: 'hundreds',      short: 'H'   },
  { one: 'thousand',     many: 'thousands',     short: 'Th'  },
  { one: 'ten thousand', many: 'ten thousands', short: 'TTh' },
  { one: 'lakh',         many: 'lakhs',         short: 'L'   },
  { one: 'ten lakh',     many: 'ten lakhs',     short: 'TL'  },
  { one: 'crore',        many: 'crores',        short: 'Cr'  },
  { one: 'ten crore',    many: 'ten crores',    short: 'TCr' },
];


// ----------------------------------------------------------------------
// SMALL HELPERS (same as Number Line Zoom)
// ----------------------------------------------------------------------
const $ = id => document.getElementById(id);
const pow10 = k => Math.pow(10, k);
const fmt = x => x.toLocaleString('en-IN');          // Indian commas

// "324 tens", "1 thousand", "0 thousands" ...
function countOf(count, L) {
  return fmt(count) + ' ' + (count === 1 ? PLACE[L].one : PLACE[L].many);
}

// Read a colour from the CSS settings at the top.
function css(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

// WHICH STEP is n in, when steps are 10^L long?
// stepOf(3245, 1) = 324  (it is in the 324th ten: 3,240 to 3,250)
// stepOf(3271, 1) = 327
// Two numbers share a step at level L exactly when these are equal.
const stepOf = (n, L) => Math.floor(n / pow10(L));

// Are A and B in the same step at level L?
const tiedAt = L => stepOf(S.a, L) === stepOf(S.b, L);

// The view at level L: 10 steps of 10^L, so 10^(L+1) wide, starting at
// the multiple of 10^(L+1) below the numbers. We only ever look at a
// level when A and B share the step ABOVE it, so using A is enough.
function viewFor(L) {
  const width = pow10(L + 1);
  return { left: Math.floor(S.a / width) * width, width: width };
}


// ----------------------------------------------------------------------
// THE STATE
// ----------------------------------------------------------------------
const S = {
  a: 0, b: 0, level: 0, topLevel: 0,
  viewLeft: 0, viewWidth: 10,
  anim: null,
  revealed: false, revealAlpha: 0,
};


// ----------------------------------------------------------------------
// CANVAS SET-UP (sharp lines on dense screens, same as before)
// ----------------------------------------------------------------------
const canvas = $('line');
const ctx = canvas.getContext('2d');
let dpr = window.devicePixelRatio || 1;

function resize() {
  dpr = window.devicePixelRatio || 1;
  canvas.width  = canvas.clientWidth  * dpr;
  canvas.height = canvas.clientHeight * dpr;
  draw();
}
window.addEventListener('resize', resize);


// ----------------------------------------------------------------------
// READING THE TWO NUMBERS
// ----------------------------------------------------------------------

// Turn typed text into a whole number, or return null if it isn't one.
function readNumber(text) {
  const clean = String(text).replace(/[,\s]/g, '');   // allow "3,245"
  if (!/^\d+$/.test(clean)) return null;
  const n = parseInt(clean, 10);                       // "0450" becomes 450
  if (String(n).length > SETTINGS.maxDigits) return null;
  return n;
}

function placeNumbers(textA, textB) {
  const a = readNumber(textA), b = readNumber(textB);
  if (a === null || b === null) {
    $('err').textContent = 'Please type two whole numbers (up to ' + SETTINGS.maxDigits + ' digits).';
    return;
  }
  $('err').textContent = '';

  S.a = a;
  S.b = b;

  // Start one level above the LONGER number, so its first digit is
  // also a choice. 3245 and 3271 have 4 digits: start at thousands
  // (0 to 10,000). For 999 vs 1000 we also start at 0 to 10,000.
  const digits = Math.max(String(a).length, String(b).length);
  S.topLevel = digits - 1;
  S.level = S.topLevel;
  S.anim = null;

  S.revealed = !SETTINGS.askBeforeReveal;
  S.revealAlpha = S.revealed ? 1 : 0;

  const v = viewFor(S.level);
  S.viewLeft = v.left;
  S.viewWidth = v.width;

  $('numA').value = fmt(a);
  $('numB').value = fmt(b);
  updateText();
  draw();
}


// ----------------------------------------------------------------------
// THE ZOOM ANIMATION (same method as Number Line Zoom)
// Keep one point p fixed on the screen and stretch everything around it,
// so the shared step grows smoothly until it fills the line.
// ----------------------------------------------------------------------
function animateTo(newLevel) {
  if (S.anim || newLevel === S.level) return;

  const v0 = { left: S.viewLeft, width: S.viewWidth };
  const v1 = viewFor(newLevel);
  const p = (v1.left * v0.width - v0.left * v1.width) / (v0.width - v1.width);

  const zoomingIn = newLevel < S.level;
  S.anim = { v0, v1, p, newLevel, zoomingIn, t0: performance.now() };
  S.level = newLevel;

  if (zoomingIn) {
    S.revealed = !SETTINGS.askBeforeReveal;   // new level: hidden again
  } else {
    S.revealed = true;                        // going back up: already seen
    S.revealAlpha = 1;
  }

  updateText();                               // e.g. clear the answer while moving
  requestAnimationFrame(step);
}

function step(now) {
  const A = S.anim;
  let t = (now - A.t0) / (SETTINGS.zoomTime * 1000);
  if (t > 1) t = 1;
  const e = t * t * (3 - 2 * t);                        // ease in and out

  S.viewWidth = A.v0.width * Math.pow(A.v1.width / A.v0.width, e);
  S.viewLeft  = A.p - (A.p - A.v0.left) * S.viewWidth / A.v0.width;

  // Zooming in to a hidden level: fade the pins out early.
  if (A.zoomingIn && !S.revealed) S.revealAlpha = Math.max(0, 1 - e * 3);

  draw();

  if (t < 1) {
    requestAnimationFrame(step);
  } else {
    S.viewLeft = A.v1.left;                    // snap exactly into place
    S.viewWidth = A.v1.width;
    S.anim = null;
    draw();
    updateText();
  }
}


// ----------------------------------------------------------------------
// REVEAL: fade in the pins and bands at the current level
// ----------------------------------------------------------------------
function reveal() {
  if (S.revealed || S.anim) return;
  S.revealed = true;
  const t0 = performance.now();
  const start = S.revealAlpha;

  function fade(now) {
    let t = (now - t0) / (SETTINGS.revealTime * 1000);
    if (t > 1) t = 1;
    S.revealAlpha = start + (1 - start) * t;
    draw();
    if (t < 1) requestAnimationFrame(fade);
  }
  requestAnimationFrame(fade);
  updateText();
}


// ----------------------------------------------------------------------
// DRAWING THE NUMBER LINE
// ----------------------------------------------------------------------
function draw() {
  const cw = canvas.clientWidth, ch = canvas.clientHeight;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cw, ch);

  // --- Layout (in pixels) ---
  // A's pin comes down from the top, B's pin comes up from the bottom,
  // so their labels never sit on top of each other.
  const padX = 52;
  const lineY = 100;
  const usable = cw - 2 * padX;

  const left = S.viewLeft, width = S.viewWidth, right = left + width;
  const X = v => padX + (v - left) / width * usable;     // number -> pixel

  // Which tick marks? (Same as Number Line Zoom: k is the level of the
  // big ticks; the smaller ticks fade in while zooming.)
  const lv = Math.log10(width) - 1;
  const k = Math.ceil(lv - 1e-9);
  const fadeIn = Math.min(1, Math.max(0, k - lv));

  // 1. The line.
  ctx.strokeStyle = css('--line');
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(padX, lineY);
  ctx.lineTo(cw - padX, lineY);
  ctx.stroke();

  // 2. The bands. The bands at the current level are the ANSWER to
  //    "same step or different?", so they wait for Reveal.
  const hide = L => (L === S.level ? S.revealAlpha : 1);
  if (k >= 1)     drawBands(k, (1 - fadeIn) * hide(k));
  if (k - 1 >= 1) drawBands(k - 1, fadeIn * hide(k - 1));

  // 3. Tick marks.
  drawTicks(k, 1, true);
  if (k - 1 >= 0) drawTicks(k - 1, fadeIn, false);

  // 4. The two pins, on top of everything.
  drawPin(S.a, css('--red'), 'top');
  drawPin(S.b, css('--blue'), 'bottom');


  // ---- Helper: the bands at level L ----
  // Same step  -> one orange band (they are tied at this place).
  // Different  -> a red band and a blue band (they have parted ways).
  // No bands at the ones level: there each number is a single point.
  function drawBands(L, alpha) {
    if (alpha <= 0.01) return;
    const s = pow10(L);
    const qa = stepOf(S.a, L), qb = stepOf(S.b, L);
    if (qa === qb) {
      drawBand(qa * s, s, css('--band-soft'), css('--band'), alpha);
    } else {
      drawBand(qa * s, s, css('--red-soft'),  css('--red'),  alpha);
      drawBand(qb * s, s, css('--blue-soft'), css('--blue'), alpha);
    }
  }

  // One band from `start` to `start + size`: a light tint plus a thick
  // coloured stroke on the line itself.
  function drawBand(start, size, fill, stroke, alpha) {
    const xa = Math.max(padX, X(start));
    const xb = Math.min(cw - padX, X(start + size));
    if (xb <= xa) return;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = fill;
    ctx.fillRect(xa, lineY - 28, xb - xa, 56);
    ctx.strokeStyle = stroke;
    ctx.lineWidth = 9;
    ctx.lineCap = 'butt';
    ctx.beginPath();
    ctx.moveTo(xa, lineY);
    ctx.lineTo(xb, lineY);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // ---- Helper: tick marks every 10^L (same as Number Line Zoom) ----
  function drawTicks(L, alpha, big) {
    if (alpha <= 0.01) return;
    const s = pow10(L);
    const i0 = Math.ceil(left / s - 1e-9);
    const i1 = Math.floor(right / s + 1e-9);

    // Thin out the labels if they would overlap.
    ctx.font = (big ? "700 " : "400 ") + "14px 'Atkinson Hyperlegible', sans-serif";
    const labelW = ctx.measureText(fmt(i1 * s)).width + 12;
    const pxPerStep = s / width * usable;
    let every = 10;
    for (const e of [1, 2, 5, 10]) { if (pxPerStep * e >= labelW) { every = e; break; } }
    const labelAlpha = big ? 1 : Math.max(0, (alpha - 0.5) * 2);

    for (let i = i0; i <= i1; i++) {
      if (!big && i % 10 === 0) continue;
      const v = i * s;
      const x = X(v);
      const h = big ? 14 : 8;

      ctx.globalAlpha = alpha;
      ctx.strokeStyle = css('--tick');
      ctx.lineWidth = big ? 2.5 : 1.5;
      ctx.beginPath();
      ctx.moveTo(x, lineY - h);
      ctx.lineTo(x, lineY + h);
      ctx.stroke();

      if (labelAlpha > 0 && i % every === 0) {
        ctx.globalAlpha = labelAlpha;
        ctx.fillStyle = css('--ink');
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(fmt(v), x, lineY + 32);
      }
    }
    ctx.globalAlpha = 1;
  }

  // ---- Helper: a pin for number v ----
  // side 'top'   : comes down from above, label at the top (A)
  // side 'bottom': comes up from below, label at the bottom (B)
  function drawPin(v, color, side) {
    if (S.revealAlpha <= 0.01) return;          // hidden while kids guess
    const x = X(v);
    if (x < -10 || x > cw + 10) return;
    ctx.globalAlpha = S.revealAlpha;
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = 3;

    // dir = -1 means "above the line", +1 means "below the line".
    const dir = side === 'top' ? -1 : 1;
    const tipY  = lineY + dir * 3;              // arrow tip, just touching the line
    const baseY = lineY + dir * 17;             // wide end of the arrow
    const endY  = side === 'top' ? 40 : ch - 40; // far end of the stem
    const textY = side === 'top' ? 22 : ch - 20; // where the number is written

    // Stem
    ctx.beginPath();
    ctx.moveTo(x, endY);
    ctx.lineTo(x, baseY);
    ctx.stroke();

    // Arrow head
    ctx.beginPath();
    ctx.moveTo(x, tipY);
    ctx.lineTo(x - 8, baseY);
    ctx.lineTo(x + 8, baseY);
    ctx.closePath();
    ctx.fill();

    // Dot on the line
    ctx.beginPath();
    ctx.arc(x, lineY, 5, 0, Math.PI * 2);
    ctx.fill();

    // The number (kept inside the canvas)
    const text = fmt(v);
    ctx.font = "800 22px 'Baloo 2', sans-serif";
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const tw = ctx.measureText(text).width;
    const cx = Math.max(tw / 2 + 4, Math.min(cw - tw / 2 - 4, x));
    ctx.fillText(text, cx, textY);
    ctx.globalAlpha = 1;
  }
}


// ----------------------------------------------------------------------
// THE DIGIT GRID AND THE EXPLANATION
// ----------------------------------------------------------------------
function updateText() {
  const L = S.level, a = S.a, b = S.b, s = pow10(L);
  const cols = S.topLevel + 1;                  // one column per place
  const tied = tiedAt(L);
  const busy = !!S.anim;

  // --- Digit grid ---
  // Each column is one place. The shorter number gets 0s in front
  // (shown in italics), so both rows line up by place: 999 vs 1000
  // becomes 0999 vs 1000.
  const strA = String(a).padStart(cols, '0');
  const strB = String(b).padStart(cols, '0');
  const lenA = String(a).length, lenB = String(b).length;

  // What colour is the column for place p?
  function colClass(p) {
    if (p > L) return 'tie';                    // above us: we only got here because they matched
    if (p === L) {
      if (busy || !S.revealed) return 'asking'; // the question being asked
      return tied ? 'tie' : 'decide';           // matched, or the deciding place
    }
    // Below us. Once they have split, these can never change the answer.
    return (S.revealed && !tied && !busy) ? 'ignore' : 'unknown';
  }

  let g = '<div></div>';                         // empty corner above the tags
  for (let j = 0; j < cols; j++) g += '<div class="head">' + PLACE[cols - 1 - j].short + '</div>';
  g += '<div class="tag a">A</div>';
  for (let j = 0; j < cols; j++) {
    const p = cols - 1 - j;
    g += '<div class="cell a ' + colClass(p) + (p >= lenA ? ' pad' : '') + '">' + strA[j] + '</div>';
  }
  g += '<div class="tag b">B</div>';
  for (let j = 0; j < cols; j++) {
    const p = cols - 1 - j;
    g += '<div class="cell b ' + colClass(p) + (p >= lenB ? ' pad' : '') + '">' + strB[j] + '</div>';
  }
  const grid = $('digits');
  grid.style.gridTemplateColumns = 'auto repeat(' + cols + ', minmax(40px, 64px))';
  grid.innerHTML = g;

  // --- Explanation ---
  const A_ = '<span class="ra">' + fmt(a) + '</span>';   // A in red
  const B_ = '<span class="rb">' + fmt(b) + '</span>';   // B in blue
  let html = 'Looking at <b>' + PLACE[L].many + '</b>. Each step on the line is <b>' +
             (L === 0 ? '1' : '1 ' + PLACE[L].one + ' (' + fmt(s) + ')') + '</b>.<br>';
  let result = '';

  if (busy) {
    // While zooming, just say what is happening.
    html += 'Zooming in…';
  } else if (!S.revealed) {
    html += '<b class="hl">' + (L === 0 ? 'Do they land on the same mark?' : 'Same step, or different steps?') +
            '</b> Make a guess, then press <b>Reveal</b>.';
  } else if (tied && L > 0) {
    // Same step: still a tie at this place.
    const q = stepOf(a, L);
    html += 'Both are between <b>' + fmt(q * s) + '</b> and <b>' + fmt((q + 1) * s) +
            '</b>: the <b>same step</b>. The ' + PLACE[L].many + ' digits match (' +
            (q % 10) + ' and ' + (q % 10) + '), so it is still a tie. <b>Zoom in</b> to look closer.';
  } else if (tied && L === 0) {
    // Same mark at the ones level: the numbers are equal.
    html += 'They land on the <b>same mark</b>. Every digit matched, so the numbers are equal.';
    result = A_ + ' = ' + B_;
  } else {
    // They have parted ways at this level.
    const qa = stepOf(a, L), qb = stepOf(b, L);
    const sign = a < b ? ' &lt; ' : ' &gt; ';
    if (L === 0) {
      html += 'They land on <b>different marks</b>. The ones digits decide: ' +
              '<span class="ra">' + (a % 10) + '</span> vs <span class="rb">' + (b % 10) + '</span>.';
    } else {
      html += '<b class="hl">They part ways here!</b> ' +
              A_ + ' is in the step from ' + fmt(qa * s) + ' to ' + fmt((qa + 1) * s) +
              ' (between ' + countOf(qa, L) + ' and ' + countOf(qa + 1, L) + '). ' +
              B_ + ' is in the step from ' + fmt(qb * s) + ' to ' + fmt((qb + 1) * s) +
              ' (between ' + countOf(qb, L) + ' and ' + countOf(qb + 1, L) + ').<br>' +
              'The ' + PLACE[L].many + ' digits decide: <span class="ra">' + (qa % 10) +
              '</span> vs <span class="rb">' + (qb % 10) + '</span>. ' +
              'Whatever the digits to the right are, each number stays inside its own band, and the bands don\'t overlap.';
    }
    result = A_ + sign + B_;
  }

  $('readout').innerHTML = html;
  $('result').innerHTML = result;
  // Show the take-home rule only once there is an answer.
  $('rule').innerHTML = result ? ruleHTML(L, tied) : '';
  updateButtons();
}


// ----------------------------------------------------------------------
// THE TAKE-HOME RULE
// The rule itself never changes. The "why" uses the numbers on screen,
// so kids see the reason worked out for THIS example.
// ----------------------------------------------------------------------
function ruleHTML(L, tied) {
  const a = S.a, b = S.b, s = pow10(L);

  // The rule, in one sentence kids can remember.
  let h = '<h2>The rule</h2>' +
          '<p class="short">Line the numbers up by place. Start from the left. ' +
          'The first place where the digits are different decides: the bigger digit makes the bigger number.</p>';

  // If the numbers have different lengths, say how the rule still works.
  const lenA = String(a).length, lenB = String(b).length;
  const padNote = (lenA !== lenB)
    ? ' A shorter number is the same as one with 0s in front (' + fmt(Math.min(a, b)) + ' is ' +
      String(Math.min(a, b)).padStart(Math.max(lenA, lenB), '0') + '), so the longer number wins at the first place.'
    : '';

  let why;
  if (tied) {
    // Equal numbers: never split.
    why = 'Every place matched, all the way to the ones, so the two numbers are equal.' + padNote;

  } else if (L === 0) {
    // Split at the ones: nothing to the right of the deciding digit.
    why = 'Every place matched until the ones, and the ones digit is the last one, so it decides.' + padNote;

  } else {
    // Split at a higher place. The key idea: everything to the right
    // can add at most 9, 99, 999 ... which is one less than a single
    // step of the deciding place. So it can never close the gap.
    const small = Math.min(a, b), big = Math.max(a, b);
    const bestSmall = stepOf(small, L) * s + (s - 1);   // smaller number with all 9s after
    const worstBig  = stepOf(big, L) * s;               // bigger number with all 0s after
    why = '<b>Why?</b> A higher place beats everything to its right. ' +
          'The digits to the right of the ' + PLACE[L].many + ' can add up to at most <b>' + fmt(s - 1) +
          '</b>, which is less than <b>1 ' + PLACE[L].one + '</b>. ' +
          'So even if ' + fmt(small) + ' had all 9s after its ' + PLACE[L].many + ' digit (<b>' + fmt(bestSmall) +
          '</b>), and ' + fmt(big) + ' had all 0s after its (<b>' + fmt(worstBig) + '</b>), ' +
          fmt(bestSmall) + ' would still be less than ' + fmt(worstBig) + '. ' +
          'On the line, each number stays inside its own band.' + padNote;
  }

  return h + '<p class="why">' + why + '</p>';
}

// Grey out buttons that can't be used right now.
function updateButtons() {
  const busy = !!S.anim;
  // Zoom in only while they still share a step (and after the reveal).
  // Once they have parted ways, the comparison is settled: no zooming.
  $('zoomIn').disabled  = busy || !S.revealed || S.level === 0 || !tiedAt(S.level);
  $('reveal').disabled  = busy || S.revealed;
  $('zoomOut').disabled = busy || S.level === S.topLevel;
  $('reset').disabled   = busy || S.level === S.topLevel;
}


// ----------------------------------------------------------------------
// BUTTONS AND KEYBOARD
// ----------------------------------------------------------------------
const go = () => placeNumbers($('numA').value, $('numB').value);
$('place').addEventListener('click', go);
$('numA').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
$('numB').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });

$('reveal').addEventListener('click', reveal);
$('zoomIn').addEventListener('click', () => { if (!$('zoomIn').disabled) animateTo(S.level - 1); });
$('zoomOut').addEventListener('click', () => { if (S.level < S.topLevel) animateTo(S.level + 1); });
$('reset').addEventListener('click', () => animateTo(S.topLevel));

document.addEventListener('keydown', e => {
  // Typing in a number box: leave the keys alone.
  if (document.activeElement === $('numA') || document.activeElement === $('numB')) return;
  if (e.key === 'r' || e.key === 'R' || e.key === ' ') { e.preventDefault(); reveal(); }
  if (e.key === 'ArrowDown' && !$('zoomIn').disabled) { e.preventDefault(); animateTo(S.level - 1); }
  if (e.key === 'ArrowUp' && S.level < S.topLevel)    { e.preventDefault(); animateTo(S.level + 1); }
});


// ----------------------------------------------------------------------
// START (wait for the fonts first)
// ----------------------------------------------------------------------
document.fonts.ready.then(() => {
  placeNumbers(SETTINGS.startA, SETTINGS.startB);
  resize();
});
</script>

</body>
</html>
